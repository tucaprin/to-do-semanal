<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-do – Pedagogia 2º Período</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream:      #FDF0F5;
  --warm-white: #FFF5F8;
  --ink:        #6B1235;
  --ink-light:  #8B2252;
  --ink-muted:  #B06080;
  --border:     #F0C0D4;
  --c1: #9D174D; --bg1: #FCE7F3;
  --c2: #BE185D; --bg2: #FDF2F8;
  --c3: #C2185B; --bg3: #FFF0F6;
  --c4: #831843; --bg4: #FCE7F3;
  --c5: #DB2777; --bg5: #FDF2F8;
  --c6: #EC4899; --bg6: #FFF0F6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--ink);
  min-height: 100vh;
  padding: 1.5rem 1rem 5rem;
}
.wrap { max-width: 560px; margin: 0 auto; }

/* HEADER */
header { text-align: center; margin-bottom: 1.75rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
header .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: .45rem; }
header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem,5vw,2.1rem); font-weight: 700; color: var(--ink); margin-bottom: .3rem; }
header h1 em { font-style: italic; color: var(--ink-muted); }
header .subtitle { font-size: 12px; color: var(--ink-muted); }

/* PROGRESS RING SUMMARY */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
  gap: .6rem;
  margin-bottom: 1.5rem;
}
.summary-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .75rem .9rem;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.summary-card .sc-label { font-size: 10px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary-card .sc-count { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; line-height: 1; }
.summary-card .sc-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 2px; }
.summary-card .sc-bar { height: 100%; border-radius: 2px; transition: width .4s; }

/* ADD TASK */
.add-box {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem 1.1rem;
  margin-bottom: 1.25rem;
}
.add-box .sec-title { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: .75rem; display: flex; align-items: center; gap: .5rem; }
.add-box .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.add-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.add-input {
  flex: 1; min-width: 160px;
  border: 1px solid var(--border); border-radius: 9px;
  padding: .5rem .75rem; font-family: 'DM Sans', sans-serif;
  font-size: 13px; background: var(--cream); color: var(--ink);
  transition: border-color .15s;
}
.add-input:focus { outline: none; border-color: #DB2777; }
.add-select {
  border: 1px solid var(--border); border-radius: 9px;
  padding: .5rem .6rem; font-family: 'DM Sans', sans-serif;
  font-size: 12px; background: var(--cream); color: var(--ink);
  cursor: pointer;
}
.add-select:focus { outline: none; }
.add-btn {
  border: none; border-radius: 9px; padding: .5rem 1rem;
  background: linear-gradient(135deg,#9D174D,#DB2777);
  color: #fff; font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity .15s; white-space: nowrap;
}
.add-btn:hover { opacity: .88; }

/* FILTERS */
.filters {
  display: flex; flex-wrap: wrap; gap: .35rem;
  margin-bottom: 1rem;
}
.filter-btn {
  border: 1px solid var(--border); border-radius: 20px;
  padding: .28rem .7rem; font-size: 11px; font-weight: 600;
  cursor: pointer; background: var(--warm-white); color: var(--ink-muted);
  font-family: 'DM Sans', sans-serif; transition: all .15s;
}
.filter-btn.active { color: #fff; border-color: transparent; }
.filter-btn.show-done { margin-left: auto; }
.filter-btn.show-done.active { background: var(--ink) !important; }

/* TASK LIST */
.task-list { display: flex; flex-direction: column; gap: .5rem; }

.task-card {
  background: var(--warm-white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: .7rem .9rem;
  display: flex; align-items: flex-start; gap: .65rem;
  transition: opacity .2s, transform .2s;
  position: relative;
}
.task-card.done-card { opacity: .55; }

.task-check {
  width: 20px; height: 20px; border-radius: 6px;
  border: 2px solid var(--border); flex-shrink: 0;
  cursor: pointer; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  transition: background .15s, border-color .15s;
}

.task-body { flex: 1; min-width: 0; }
.task-text { font-size: 13px; color: var(--ink-light); line-height: 1.4; word-break: break-word; }
.task-text.done { text-decoration: line-through; color: var(--ink-muted); }
.task-meta { display: flex; align-items: center; gap: .4rem; margin-top: .35rem; }
.task-badge {
  border-radius: 5px; padding: 2px 6px;
  font-size: 9px; font-weight: 700; letter-spacing: .04em;
}
.task-date { font-size: 10px; color: var(--ink-muted); }

.task-del {
  background: none; border: none; cursor: pointer;
  font-size: 13px; color: var(--ink-muted); opacity: .25;
  flex-shrink: 0; padding: 0; line-height: 1;
  transition: opacity .15s;
}
.task-del:hover { opacity: .65; }

/* EMPTY */
.empty {
  text-align: center; padding: 3rem 1rem;
  color: var(--ink-muted); font-size: 13px;
  background: var(--warm-white); border: 1px dashed var(--border);
  border-radius: 14px;
}
.empty .empty-icon { font-size: 2rem; margin-bottom: .5rem; display: block; }

/* TOAST */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: #831843; color: #fff; padding: .6rem 1.2rem; border-radius: 9px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; z-index: 999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">UFPE · Pedagogia · 2º Período</p>
  <h1>To-do de <em>Estudos</em></h1>
  <p class="subtitle">Adicione tarefas por disciplina e marque conforme concluir 🌸</p>
</header>

<!-- SUMMARY -->
<div class="summary" id="summary"></div>

<!-- ADD -->
<div class="add-box">
  <div class="sec-title">Nova tarefa</div>
  <div class="add-row">
    <input class="add-input" id="task-input" type="text" placeholder="O que precisa fazer?" onkeydown="if(event.key==='Enter')addTask()">
    <select class="add-select" id="task-subject">
      <option value="c1">História Geral</option>
      <option value="c2">PPP1</option>
      <option value="c3">Psicologia</option>
      <option value="c4">Metodologia</option>
      <option value="c5">Seminário</option>
      <option value="c6">Revisão / Anki</option>
    </select>
    <button class="add-btn" onclick="addTask()">＋ Adicionar</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filters" id="filters"></div>

<!-- LIST -->
<div class="task-list" id="task-list"></div>

</div>
<div class="toast" id="toast"></div>

<script>
const SUBJECTS = {
  c1: { label: 'História Geral da Edu.',      color: '#9D174D', bg: '#FCE7F3' },
  c2: { label: 'PPP1 – Processos Formativos', color: '#BE185D', bg: '#FDF2F8' },
  c3: { label: 'Psicologia do Ensino',         color: '#C2185B', bg: '#FFF0F6' },
  c4: { label: 'Metodologia da Pesquisa',      color: '#831843', bg: '#FCE7F3' },
  c5: { label: 'Seminário Espaços Não-Esc.',   color: '#DB2777', bg: '#FDF2F8' },
  c6: { label: 'Revisão / Anki',               color: '#EC4899', bg: '#FFF0F6' },
};

let tasks     = JSON.parse(localStorage.getItem('ped-tasks') || '[]');
let filter    = 'all';
let showDone  = true;

function save() { localStorage.setItem('ped-tasks', JSON.stringify(tasks)); }

// ── ADD ──
function addTask() {
  const input = document.getElementById('task-input');
  const sel   = document.getElementById('task-subject');
  const text  = input.value.trim();
  if (!text) { input.focus(); return; }
  tasks.unshift({
    id: Date.now(),
    text,
    key: sel.value,
    done: false,
    createdAt: new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' })
  });
  save();
  input.value = '';
  render();
  showToast('✓ Tarefa adicionada!');
}

// ── TOGGLE ──
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

// ── DELETE ──
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
  showToast('🗑️ Tarefa removida');
}

// ── RENDER ALL ──
function render() {
  renderSummary();
  renderFilters();
  renderList();
}

// ── SUMMARY CARDS ──
function renderSummary() {
  const cont = document.getElementById('summary');
  cont.innerHTML = '';

  // total card
  const total = tasks.length;
  const totalDone = tasks.filter(t=>t.done).length;
  const totalCard = document.createElement('div');
  totalCard.className = 'summary-card';
  totalCard.style.borderColor = '#F9A8D4';
  const totalPct = total ? Math.round((totalDone/total)*100) : 0;
  totalCard.innerHTML = `
    <span class="sc-label">Total de tarefas</span>
    <span class="sc-count" style="color:#BE185D">${totalDone}<span style="font-size:.75rem;color:var(--ink-muted)">/${total}</span></span>
    <div class="sc-bar-wrap"><div class="sc-bar" style="width:${totalPct}%;background:linear-gradient(90deg,#9D174D,#EC4899)"></div></div>`;
  cont.appendChild(totalCard);

  Object.entries(SUBJECTS).forEach(([key, sub]) => {
    const all  = tasks.filter(t=>t.key===key);
    if (!all.length) return;
    const done = all.filter(t=>t.done).length;
    const pct  = Math.round((done/all.length)*100);
    const card = document.createElement('div');
    card.className = 'summary-card';
    card.style.cssText = `border-color:${sub.color}33;cursor:pointer;`;
    card.onclick = () => { filter=filter===key?'all':key; render(); };
    card.innerHTML = `
      <span class="sc-label">${sub.label.split(' ')[0]}</span>
      <span class="sc-count" style="color:${sub.color}">${done}<span style="font-size:.75rem;color:var(--ink-muted)">/${all.length}</span></span>
      <div class="sc-bar-wrap"><div class="sc-bar" style="width:${pct}%;background:${sub.color}"></div></div>`;
    cont.appendChild(card);
  });
}

// ── FILTERS ──
function renderFilters() {
  const cont = document.getElementById('filters');
  cont.innerHTML = '';

  const all = document.createElement('button');
  all.className = 'filter-btn' + (filter==='all'?' active':'');
  if (filter==='all') all.style.cssText='background:linear-gradient(135deg,#9D174D,#DB2777);color:#fff;';
  all.textContent = 'Todas';
  all.onclick = () => { filter='all'; render(); };
  cont.appendChild(all);

  Object.entries(SUBJECTS).forEach(([key, sub]) => {
    if (!tasks.some(t=>t.key===key)) return;
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (filter===key?' active':'');
    if (filter===key) btn.style.cssText=`background:${sub.color};color:#fff;`;
    btn.textContent = sub.label.split(' ')[0];
    btn.onclick = () => { filter=key; render(); };
    cont.appendChild(btn);
  });

  // show/hide done toggle
  const tog = document.createElement('button');
  tog.className = 'filter-btn show-done' + (showDone?' active':'');
  if (showDone) tog.style.cssText='background:#831843;color:#fff;';
  tog.textContent = showDone ? '👁 Ocultar concluídas' : '👁 Ver concluídas';
  tog.onclick = () => { showDone=!showDone; render(); };
  cont.appendChild(tog);
}

// ── TASK LIST ──
function renderList() {
  const cont = document.getElementById('task-list');
  cont.innerHTML = '';

  let filtered = filter==='all' ? [...tasks] : tasks.filter(t=>t.key===filter);
  if (!showDone) filtered = filtered.filter(t=>!t.done);

  // sort: pendentes primeiro, depois por data de criação
  filtered.sort((a,b) => a.done - b.done);

  if (!filtered.length) {
    cont.innerHTML = `<div class="empty">
      <span class="empty-icon">🌸</span>
      ${tasks.length===0
        ? 'Nenhuma tarefa ainda.<br><span style="font-size:11px">Adicione sua primeira tarefa acima!</span>'
        : 'Nenhuma tarefa${filter!=="all"?" nesta disciplina":""} para mostrar.'}
    </div>`;
    return;
  }

  filtered.forEach(t => {
    const sub  = SUBJECTS[t.key];
    const card = document.createElement('div');
    card.className = 'task-card' + (t.done?' done-card':'');
    card.innerHTML = `
      <div class="task-check" onclick="toggleTask(${t.id})"
        style="${t.done
          ? `background:${sub.color};border-color:${sub.color};`
          : `border-color:${sub.color};`}">
        ${t.done ? '✓' : ''}
      </div>
      <div class="task-body">
        <div class="task-text${t.done?' done':''}">${esc(t.text)}</div>
        <div class="task-meta">
          <span class="task-badge" style="background:${sub.bg};color:${sub.color}">${sub.label.split(' ')[0]}</span>
          ${t.createdAt ? `<span class="task-date">${t.createdAt}</span>` : ''}
        </div>
      </div>
      <button class="task-del" onclick="deleteTask(${t.id})" title="Remover">✕</button>`;
    cont.appendChild(card);
  });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── TOAST ──
let toastT;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2500);
}

// ── INIT ──
render();
</script>
</body>
</html>
